<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TikTok Live Overlay</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent;font-family:Arial,Helvetica,sans-serif;color:#fff}
#chat{position:fixed;inset:0;padding:12px;display:flex;flex-direction:column;gap:8px;overflow-y:auto;overflow-x:hidden;box-sizing:border-box;scroll-behavior:smooth;justify-content:flex-start}
#chat::-webkit-scrollbar{width:6px}#chat::-webkit-scrollbar-thumb{background:rgba(255,255,255,.25);border-radius:10px}
.msg{flex:0 0 auto;align-self:stretch;background:rgba(20,20,26,.78);border-radius:10px;padding:8px 12px;font-size:18px;line-height:1.3;text-shadow:0 1px 3px #000;backdrop-filter:blur(4px);animation:in .2s ease}
.user{font-weight:700;margin-right:7px}.chat .user{color:#25f4ee}.member .user{color:#b39cff}.like .user{color:#ff8eb0}.gift .user{color:#ffd166}
.system{opacity:.7;font-size:14px;text-align:center}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
</style>
</head>
<body>
<div id="chat"></div>
<audio id="bgAudio" preload="auto"></audio>
<script src="/socket.io/socket.io.js"></script>
<script>
const socket=io({transports:['websocket','polling']});
const chat=document.getElementById('chat');
const params=new URLSearchParams(location.search);
const user=(params.get('user')||'').replace(/^@/,'').trim();
const maxMessages=120;
const bgAudio=document.getElementById('bgAudio');
const bgUrl=params.get('bgAudio')||'';
const bgVol=Math.min(1,Math.max(0,Number(params.get('bgVol')||0.25)));
const duckVol=Math.min(1,Math.max(0,Number(params.get('duck')||0.08)));
bgAudio.volume=bgVol;
bgAudio.loop=params.get('bgLoop')!=='0';
let bgStarted=false;
function startBg(){
 if(!bgUrl || bgStarted) return;
 bgAudio.src=bgUrl; bgAudio.volume=bgVol;
 bgAudio.play().then(()=>bgStarted=true).catch(()=>{});
}
['pointerdown','keydown','touchstart'].forEach(ev=>window.addEventListener(ev,startBg,{once:true,passive:true}));
if(bgUrl){ setTimeout(startBg,250); }
function duckBg(on){ if(bgAudio.src) bgAudio.volume=on?duckVol:bgVol; }
function esc(v){const d=document.createElement('div');d.textContent=String(v??'');return d.innerHTML}
function add(user,text,type){
 const el=document.createElement('div');el.className='msg '+(type||'');
 if(type==='system') el.textContent=text;
 else el.innerHTML='<span class="user">'+esc(user)+'</span><span>'+esc(text)+'</span>';
 chat.appendChild(el);
 while(chat.children.length>maxMessages) chat.removeChild(chat.firstChild);
 requestAnimationFrame(()=>el.scrollIntoView({behavior:'smooth',block:'end'}));
}
if(user) socket.emit('connect-to-live',user);
socket.on('chat-message',d=>add(d.user,d.comment,'chat'));
socket.on('member-message',d=>add(d.user,'se unió al live 👋','member'));
socket.on('like-message',d=>add(d.user,'dio '+(d.likeCount||1)+' likes ❤️','like'));
socket.on('gift-message',d=>add(d.user,'envió '+(d.repeatCount||1)+'x '+d.giftName+' 🎁','gift'));
socket.on('connection-error',m=>add('Sistema',m,'system'));
</script>
</body>
</html>
