<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Lector de Chat en Vivo - TikTok</title>
<style>
:root{--bg:#0f0f12;--panel:#17171c;--panel2:#1e1e26;--accent:#fe2c55;--cyan:#25f4ee;--bot:#9b7cff;--ok:#3ddc84;--txt:#f2f2f2;--muted:#9999a6}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center}
header{width:100%;max-width:620px;padding:18px 16px 8px;text-align:center}
h1{margin:0;font-size:1.35rem;background:linear-gradient(90deg,var(--cyan),var(--accent));-webkit-background-clip:text;background-clip:text;color:transparent}
.status{margin-top:5px;font-size:.85rem;color:var(--muted)} .live{color:var(--ok)} .error{color:var(--accent)}
.controls,.options,#chatBox{width:calc(100% - 32px);max-width:620px}
.controls{padding:12px 0;display:grid;grid-template-columns:1fr auto auto;gap:8px}
input[type=text],select{background:var(--panel2);color:var(--txt);border:1px solid #30303a;border-radius:10px;padding:12px}
input[type=text]{min-width:0;font-size:1rem}
button{border:0;border-radius:10px;padding:12px 16px;font-weight:700;cursor:pointer}
#connectBtn{background:var(--accent);color:#fff} #disconnectBtn{background:#333;color:#fff}
#testBtn{background:var(--cyan);color:#111;width:100%;margin-bottom:10px}
button:disabled{opacity:.45;cursor:not-allowed}
.options{background:var(--panel);border-radius:14px;padding:12px 14px;margin-bottom:12px;display:flex;flex-direction:column;gap:11px}
.row{display:grid;grid-template-columns:1fr minmax(110px,240px) auto;gap:10px;align-items:center;font-size:.9rem;color:var(--muted)}
.row label{color:var(--txt)}
input[type=range]{width:100%}
select{padding:8px}
.check{display:flex;align-items:center;gap:8px}
#chatBox{background:var(--panel);border-radius:14px;padding:10px;overflow:auto;max-height:58vh;min-height:180px;display:flex;flex-direction:column;gap:8px}
.msg{padding:9px 12px;border-radius:11px;background:var(--panel2);line-height:1.4;font-size:.92rem;word-break:break-word}
.msg.bot{border-left:3px solid var(--bot)} .msg.bot .user{color:var(--bot)}
.msg.reading{border-left:3px solid var(--ok);box-shadow:0 0 12px rgba(61,220,132,.14)}
.msg.gift .user{color:#ffd166}
.user{color:var(--cyan);font-weight:800;margin-right:7px}
.system{background:transparent;color:var(--muted);text-align:center;font-size:.8rem;font-style:italic}
.badge{display:inline-block;padding:2px 7px;border-radius:999px;font-size:.67rem;margin-left:7px;background:#2b2b34;color:var(--muted);font-weight:700}
.badge.read{background:#16472b;color:var(--ok)} .badge.bot{background:#342866;color:#c2b5ff}
.skip{opacity:.45}
footer{max-width:620px;padding:12px 20px 18px;text-align:center;color:var(--muted);font-size:.74rem}
@media(max-width:560px){.controls{grid-template-columns:1fr 1fr}.controls input{grid-column:1/-1}.row{grid-template-columns:1fr minmax(100px,160px) auto}}
</style>
</head>
<body>
<header>
<h1>🔊 Lector de Chat en Vivo</h1>
<div id="status" class="status">Sin conectar</div>
</header>

<div class="controls">
<input id="username" type="text" placeholder="usuario de TikTok (sin @)" autocomplete="off">
<button id="connectBtn">Conectar</button>
<button id="disconnectBtn" disabled>Detener</button>
</div>

<section class="options">
<button id="testBtn">🔊 Probar voz</button>

<div class="row">
<label for="voiceSelect">Voz disponible</label>
<select id="voiceSelect"></select>
<span></span>
</div>

<div class="row">
<label for="rate">Velocidad</label>
<input id="rate" type="range" min=".6" max="1.8" step=".05" value="1.05">
<span id="rateVal">1.05</span>
</div>

<div class="row">
<label for="pitch">Tono</label>
<input id="pitch" type="range" min=".5" max="1.5" step=".05" value="1">
<span id="pitchVal">1.00</span>
</div>

<div class="row">
<label for="volume">Volumen</label>
<input id="volume" type="range" min="0" max="1" step=".05" value="1">
<span id="volumeVal">100%</span>
</div>

<div class="row">
<label for="maxQueue">Máximo de mensajes en cola</label>
<input id="maxQueue" type="range" min="2" max="15" step="1" value="6">
<span id="maxQueueVal">6</span>
</div>

<div class="row">
<label for="minLen">Ignorar mensajes menores de</label>
<input id="minLen" type="range" min="0" max="10" step="1" value="1">
<span id="minLenVal">1</span>
</div>

<div class="check">
<input id="readUser" type="checkbox" checked>
<label for="readUser">Decir “nombre dice: mensaje”</label>
</div>

<div class="check">
<input id="readBot" type="checkbox" checked>
<label for="readBot">Leer también las respuestas del bot</label>
</div>
</section>

<div id="chatBox"></div>
<footer>👤 Chat recibido · 🤖 Bot · 🔊 LEYENDO = mensaje que la voz está reproduciendo</footer>

<script src="/socket.io/socket.io.js"></script>
<script>
const socket = io();

const $ = id => document.getElementById(id);
const statusEl=$("status"), chatBox=$("chatBox"), usernameInput=$("username");
const connectBtn=$("connectBtn"), disconnectBtn=$("disconnectBtn"), testBtn=$("testBtn");
const voiceSelect=$("voiceSelect"), rate=$("rate"), pitch=$("pitch"), volume=$("volume");
const maxQueue=$("maxQueue"), minLen=$("minLen"), readUser=$("readUser"), readBot=$("readBot");

let voices=[];
let queue=[];
let speaking=false;
let currentEl=null;
let voiceReady=false;

function updateLabels(){
  $("rateVal").textContent=Number(rate.value).toFixed(2);
  $("pitchVal").textContent=Number(pitch.value).toFixed(2);
  $("volumeVal").textContent=Math.round(Number(volume.value)*100)+"%";
  $("maxQueueVal").textContent=maxQueue.value;
  $("minLenVal").textContent=minLen.value;
}
["rate","pitch","volume","maxQueue","minLen"].forEach(id=>$(id).addEventListener("input",updateLabels));
updateLabels();

function loadVoices(){
  voices=speechSynthesis.getVoices() || [];
  const spanish=voices.filter(v=>/^es([_-]|$)/i.test(v.lang));
  const list=spanish.length?spanish:voices;
  voiceSelect.innerHTML="";
  if(!list.length){
    const o=document.createElement("option");
    o.textContent="El navegador aún no cargó las voces";
    voiceSelect.appendChild(o);
    voiceReady=false;
    return;
  }
  list.forEach(v=>{
    const o=document.createElement("option");
    o.value=v.name;
    o.textContent=`${v.name} — ${v.lang}${v.default?" (predeterminada)":""}`;
    voiceSelect.appendChild(o);
  });
  const preferred=[
    /Google.*español/i,/Microsoft.*es-ES/i,/Microsoft.*es-MX/i,
    /Microsoft.*es-CO/i,/Android.*es/i,/Spanish/i
  ];
  let best=null;
  for(const re of preferred){best=list.find(v=>re.test(v.name+" "+v.lang)); if(best) break;}
  voiceSelect.value=(best||list[0]).name;
  voiceReady=true;
}
loadVoices();
if("onvoiceschanged" in speechSynthesis) speechSynthesis.onvoiceschanged=loadVoices;

function cleanForSpeech(text){
  return String(text||"")
    .replace(/https?:\/\/\S+/gi," enlace ")
    .replace(/www\.\S+/gi," enlace ")
    .replace(/[@#]/g," ")
    .replace(/\s+/g," ")
    .trim();
}

function markReading(el,on){
  if(!el) return;
  el.classList.toggle("reading",on);
  const old=el.querySelector('[data-reading="1"]');
  if(on){
    if(!old){
      const b=document.createElement("span");
      b.className="badge read"; b.dataset.reading="1"; b.textContent="🔊 LEYENDO";
      el.appendChild(b);
    }
  } else if(old) old.remove();
}

function enqueueSpeech(text,el){
  const limit=Number(maxQueue.value);
  while(queue.length>=limit){
    const dropped=queue.shift();
    if(dropped?.el){
      dropped.el.classList.add("skip");
      const b=document.createElement("span");
      b.className="badge"; b.textContent="omitido";
      dropped.el.appendChild(b);
    }
  }
  queue.push({text:cleanForSpeech(text),el});
  processQueue();
}

function finishSpeech(){
  markReading(currentEl,false);
  currentEl=null;
  speaking=false;
  processQueue();
}

function processQueue(){
  if(speaking||!queue.length) return;
  const item=queue.shift();
  speaking=true;
  currentEl=item.el;
  markReading(currentEl,true);

  const u=new SpeechSynthesisUtterance(item.text);
  const v=voices.find(x=>x.name===voiceSelect.value);
  if(v){u.voice=v;u.lang=v.lang;} else u.lang="es-ES";
  u.rate=Number(rate.value);
  u.pitch=Number(pitch.value);
  u.volume=Number(volume.value);
  u.onend=finishSpeech;
  u.onerror=finishSpeech;

  try{
    speechSynthesis.speak(u);
  }catch(e){
    console.error(e);
    finishSpeech();
  }
}

function addMessage({user="",text="",type=""}){
  const d=document.createElement("div");
  d.className="msg "+type;
  if(type==="system"){
    d.textContent=text;
  }else{
    const u=document.createElement("span");
    u.className="user"; u.textContent=user||"Usuario";
    const t=document.createElement("span");
    t.className="text"; t.textContent=text;
    d.append(u,t);
  }
  chatBox.appendChild(d);
  while(chatBox.children.length>120) chatBox.removeChild(chatBox.firstChild);
  chatBox.scrollTop=chatBox.scrollHeight;
  return d;
}

testBtn.addEventListener("click",()=>{
  speechSynthesis.cancel();
  queue=[];
  speaking=false;
  markReading(currentEl,false);
  currentEl=null;

  const u=new SpeechSynthesisUtterance("Prueba de voz. Alejandro dice: hola, la voz está funcionando correctamente.");
  const v=voices.find(x=>x.name===voiceSelect.value);
  if(v){u.voice=v;u.lang=v.lang;}else u.lang="es-ES";
  u.rate=Number(rate.value); u.pitch=Number(pitch.value); u.volume=Number(volume.value);
  u.onend=()=>{}; u.onerror=e=>console.error("Speech error",e);

  try{speechSynthesis.speak(u);}catch(e){console.error(e);}
});

socket.on("connected",({username})=>{
  statusEl.textContent=`🔴 EN VIVO — conectado a @${username}`;
  statusEl.className="status live";
  connectBtn.disabled=true; disconnectBtn.disabled=false;
  addMessage({type:"system",text:`Conectado al live de @${username}`});
});

socket.on("connection-error",msg=>{
  statusEl.textContent="❌ "+msg; statusEl.className="status error";
  connectBtn.disabled=false; disconnectBtn.disabled=true;
  addMessage({type:"system",text:"Error: "+msg});
});

socket.on("stream-ended",()=>{
  statusEl.textContent="El live terminó o se desconectó."; statusEl.className="status error";
  connectBtn.disabled=false; disconnectBtn.disabled=true;
  speechSynthesis.cancel(); queue=[]; speaking=false; markReading(currentEl,false); currentEl=null;
  addMessage({type:"system",text:"El LIVE terminó."});
});

/* =========================
   MENSAJES DE TIKTOK
   ========================= */

const seenMessages = new Set();

function normalizeIncoming(payload){
  if(payload == null) return null;

  /* Algunos servidores mandan directamente un string */
  if(typeof payload === "string"){
    const text = payload.trim();
    if(!text) return null;
    return {user:"Usuario", text};
  }

  /* Otros mandan un objeto con nombres diferentes */
  if(typeof payload === "object"){
    const user =
      payload.user ??
      payload.username ??
      payload.uniqueId ??
      payload.nickname ??
      payload.name ??
      payload.sender ??
      payload.author?.uniqueId ??
      payload.author?.nickname ??
      "Usuario";

    const text =
      payload.comment ??
      payload.message ??
      payload.text ??
      payload.content ??
      payload.chatMessage ??
      payload.msg ??
      payload.data?.comment ??
      payload.data?.message ??
      payload.data?.text;

    if(text !== undefined && text !== null && String(text).trim()){
      return {
        user:String(user),
        text:String(text)
      };
    }
  }

  return null;
}

function messageKey(user,text){
  return `${user}|${text}|${Date.now()}`;
}

function handleChatPayload(payload){
  const normalized = normalizeIncoming(payload);
  if(!normalized) return false;

  const user = normalized.user;
  const text = normalized.text;

  /*
   * Evitar que onAny + el listener específico
   * creen dos veces el mismo mensaje.
   */
  const now = Date.now();
  const signature = `${user}|${text}`;
  const previous = window.__lastChatSignature;

  if(previous && previous.signature === signature && now - previous.time < 1200){
    return true;
  }

  window.__lastChatSignature = {signature,time:now};

  const el = addMessage({user,text});

  if(text.trim().length >= Number(minLen.value)){
    const spoken = readUser.checked
      ? `${user} dice: ${text}`
      : text;

    enqueueSpeech(spoken,el);
  }

  return true;
}

/*
 * Evento que usaba tu HTML original.
 */
socket.on("chat-message",(payload)=>{
  handleChatPayload(payload);
});

/*
 * Compatibilidad con distintos nombres que puede usar
 * el server: chat, comment, message, chatMessage, etc.
 */
[
  "chat",
  "comment",
  "comments",
  "message",
  "chatMessage",
  "comment-message",
  "commentMessage",
  "tiktok-chat",
  "tiktok-comment"
].forEach(eventName=>{
  socket.on(eventName,(payload)=>{
    handleChatPayload(payload);
  });
});

/*
 * ESTA ES LA PARTE IMPORTANTE:
 * Socket.IO permite escuchar cualquier evento.
 * Así, aunque tu server use otro nombre, intentamos
 * reconocer automáticamente un objeto que contenga
 * usuario + comentario/mensaje.
 */
socket.onAny((eventName,...args)=>{
  const ignored = new Set([
    "connected",
    "connection-error",
    "stream-ended",
    "gift-message",
    "like-message",
    "member-message",
    "bot-message",
    "bot-reading"
  ]);

  if(ignored.has(eventName)) return;
  if(!args.length) return;

  const payload = args[0];

  /*
   * Primero intenta reconocer si realmente parece
   * un mensaje de chat.
   */
  const normalized = normalizeIncoming(payload);

  if(normalized){
    console.log("[CHAT DETECTADO]", eventName, normalized);
    handleChatPayload(payload);
  }else{
    console.log("[SOCKET EVENT]", eventName, payload);
  }
});

/* LO QUE EL BOT ENVÍA. Acepta message o text. */
socket.on("bot-message",({user="BOT",message,text})=>{
  const answer=String(message??text??"");
  if(!answer) return;

  const el=addMessage({
    user,
    text:answer,
    type:"bot"
  });

  if(readBot.checked){
    enqueueSpeech(`Bot dice: ${answer}`,el);
  }
});

/* Si tu servidor manda solo "bot-reading", también se ve. */
socket.on("bot-reading",({user="BOT",message,text})=>{
  const content=String(message??text??"");
  if(!content) return;

  addMessage({
    user,
    text:content,
    type:"bot"
  });
});

socket.on("gift-message",({user,giftName,repeatCount})=>{
  addMessage({user,text:`envió ${repeatCount||1}x ${giftName||"regalo"} 🎁`,type:"gift"});
});

socket.on("member-message",({user})=>{
  if(user) addMessage({type:"system",text:`${user} se unió al LIVE 👋`});
});

connectBtn.addEventListener("click",()=>{
  const username=usernameInput.value.trim().replace(/^@/,"");
  if(!username) return;

  /* La interacción del botón ayuda a desbloquear TTS en Android/Chrome. */
  speechSynthesis.cancel(); queue=[]; speaking=false; markReading(currentEl,false); currentEl=null;
  chatBox.innerHTML="";
  statusEl.textContent="Conectando...";
  statusEl.className="status";
  socket.emit("connect-to-live",username);
});

disconnectBtn.addEventListener("click",()=>{
  socket.emit("disconnect-live");
  speechSynthesis.cancel(); queue=[]; speaking=false; markReading(currentEl,false); currentEl=null;
  statusEl.textContent="Desconectado."; statusEl.className="status";
  connectBtn.disabled=false; disconnectBtn.disabled=true;
});

document.addEventListener("click",()=>{
  /* carga perezosa de voces y evita quedarnos sin lista en Android */
  if(!voiceReady) loadVoices();
},{once:true});
</script>
</body>
</html>
