<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lector de Chat en Vivo - TikTok</title>
<style>
  :root{
    --bg:#0f0f12;
    --panel:#17171c;
    --panel2:#1e1e26;
    --accent:#fe2c55;
    --accent2:#25f4ee;
    --text:#f2f2f2;
    --muted:#9a9aa5;
    --ok:#3ddc84;
    --gold:#ffd166;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    background:var(--bg);
    color:var(--text);
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
  }
  header{
    width:100%;
    padding:18px 16px 8px;
    text-align:center;
    position:relative;
  }
  header h1{
    margin:0;
    font-size:1.3rem;
    background:linear-gradient(90deg,var(--accent2),var(--accent));
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
  }
  .status{
    font-size:.85rem;
    color:var(--muted);
    margin-top:4px;
  }
  .status.live{color:var(--ok);}
  .status.error{color:var(--accent);}

  .speaking-indicator{
    display:none;
    align-items:center;
    justify-content:center;
    gap:3px;
    margin-top:8px;
    height:16px;
  }
  .speaking-indicator.active{display:flex;}
  .speaking-indicator span{
    width:3px;
    background:var(--ok);
    border-radius:2px;
    animation:bounce 0.9s ease-in-out infinite;
  }
  .speaking-indicator span:nth-child(1){height:6px;animation-delay:0s;}
  .speaking-indicator span:nth-child(2){height:14px;animation-delay:.15s;}
  .speaking-indicator span:nth-child(3){height:10px;animation-delay:.3s;}
  .speaking-indicator span:nth-child(4){height:16px;animation-delay:.45s;}
  .speaking-indicator span:nth-child(5){height:8px;animation-delay:.6s;}
  @keyframes bounce{0%,100%{transform:scaleY(.4);}50%{transform:scaleY(1);}}

  .stats-bar{
    display:flex;
    justify-content:center;
    gap:16px;
    margin-top:6px;
    font-size:.72rem;
    color:var(--muted);
  }
  .stats-bar b{color:var(--text);}

  .controls{
    width:100%;
    max-width:520px;
    padding:12px 16px;
    display:flex;
    gap:8px;
    flex-wrap:wrap;
  }
  input[type=text]{
    flex:1;
    min-width:150px;
    padding:12px 14px;
    border-radius:10px;
    border:1px solid #2c2c35;
    background:var(--panel2);
    color:var(--text);
    font-size:1rem;
  }
  button{
    padding:12px 18px;
    border-radius:10px;
    border:none;
    font-weight:600;
    cursor:pointer;
    font-size:.95rem;
  }
  #connectBtn{background:var(--accent);color:white;}
  #disconnectBtn{background:#333;color:white;}
  #skipBtn{background:var(--accent2);color:#111;width:100%;margin-bottom:2px;}
  #skipBtn:disabled{opacity:.35;cursor:not-allowed;}
  #disconnectBtn:disabled, #connectBtn:disabled{opacity:.4;cursor:not-allowed;}

  .options{
    width:100%;
    max-width:520px;
    padding:0 16px 12px;
    display:flex;
    flex-direction:column;
    gap:10px;
    background:var(--panel);
    border-radius:12px;
    margin:0 16px 12px;
    padding-top:12px;
  }
  .row{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:.9rem;color:var(--muted);}
  .row label{flex:1;}
  input[type=range]{flex:1;max-width:140px;}
  select{
    background:var(--panel2);
    color:var(--text);
    border:1px solid #2c2c35;
    border-radius:8px;
    padding:6px 8px;
  }

  .mode-switch{
    display:flex;
    background:var(--panel2);
    border-radius:10px;
    padding:4px;
    gap:4px;
  }
  .mode-switch button{
    flex:1;
    padding:9px 8px;
    border-radius:8px;
    background:transparent;
    color:var(--muted);
    font-size:.82rem;
    font-weight:700;
  }
  .mode-switch button.active{
    background:var(--accent);
    color:#fff;
  }
  .mode-switch button.active.cooldown-active{
    background:var(--accent2);
    color:#111;
  }

  .mode-panel{display:none;flex-direction:column;gap:10px;}
  .mode-panel.active{display:flex;}

  #chatBox{
    width:100%;
    max-width:520px;
    flex:1;
    background:var(--panel);
    margin:0 16px 16px;
    border-radius:14px;
    padding:10px;
    overflow-y:auto;
    display:flex;
    flex-direction:column;
    gap:8px;
    max-height:50vh;
  }
  .msg{
    background:var(--panel2);
    border-radius:10px;
    padding:8px 12px;
    font-size:.92rem;
    line-height:1.35;
    animation:fadeIn .25s ease;
    border-left:3px solid transparent;
  }
  .msg.system{
    color:var(--muted);
    font-style:italic;
    background:transparent;
    text-align:center;
    font-size:.8rem;
  }
  .msg .user{
    color:var(--accent2);
    font-weight:700;
    margin-right:6px;
  }
  .msg.gift{border-left-color:var(--gold);}
  .msg.gift .user{color:var(--gold);}
  .msg.skipped{opacity:.4;}
  .msg.reading{
    border-left-color:var(--ok);
    box-shadow:0 0 10px rgba(61,220,132,.15);
  }
  .badge{
    display:inline-block;
    font-size:.7rem;
    background:#2c2c35;
    color:var(--muted);
    border-radius:6px;
    padding:1px 6px;
    margin-left:6px;
  }
  .badge.read{background:#16472b;color:var(--ok);}
  @keyframes fadeIn{from{opacity:0;transform:translateY(4px);}to{opacity:1;transform:translateY(0);}}

  footer{
    color:var(--muted);
    font-size:.74rem;
    padding:0 20px 16px;
    text-align:center;
  }

  .top-actions{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:8px}
  #testVoiceBtn{background:#2b2b35;color:#fff}
  #overlayBtn{background:#25f4ee;color:#111}
  .overlay-banner{display:none;position:fixed;top:10px;right:10px;z-index:20;background:rgba(15,15,18,.85);padding:6px 10px;border-radius:999px;font-size:.72rem;color:#fff;backdrop-filter:blur(8px)}
  body.overlay-mode{background:transparent;align-items:stretch}
  body.overlay-mode header,body.overlay-mode .controls,body.overlay-mode .options,body.overlay-mode footer,body.overlay-mode .overlay-hide{display:none!important}
  body.overlay-mode #chatBox{display:flex;max-width:none;width:100%;height:100vh;max-height:none;margin:0;padding:10px;background:transparent;overflow:hidden;justify-content:flex-end}
  body.overlay-mode #chatBox .msg{background:rgba(20,20,26,.76);text-shadow:0 1px 2px #000;backdrop-filter:blur(4px)}
  .event-member{border-left-color:#7c5cff}.event-member .user{color:#b39cff}
  .event-like{border-left-color:#ff5b8a}.event-like .user{color:#ff8eb0}
  .event-gift{border-left-color:var(--gold)}
  .tiny{font-size:.75rem;color:var(--muted);line-height:1.3}
  .check-grid{display:grid;grid-template-columns:1fr 1fr;gap:7px}
  .check-grid label{font-size:.82rem;color:var(--muted)}
  .overlay-url{font-size:.76rem;word-break:break-all;background:#111118;border:1px solid #2c2c35;border-radius:8px;padding:8px;color:#bfbfc9;display:none}
</style>
</head>
<body>

<header>
  <h1>🔊 Lector de Chat en Vivo</h1>
  <div class="status" id="status">Sin conectar</div>
  <div class="speaking-indicator" id="speakingIndicator">
    <span></span><span></span><span></span><span></span><span></span>
  </div>
  <div class="stats-bar">
    <span>🗣️ Leídos: <b id="statRead">0</b></span>
    <span>⏭️ Omitidos: <b id="statSkipped">0</b></span>
  </div>
</header>

<div class="controls">
  <input type="text" id="username" placeholder="usuario de TikTok (sin @)">
  <button id="connectBtn">Conectar</button>
  <button id="disconnectBtn" disabled>Detener</button>
</div>
<div class="top-actions overlay-hide">
  <button id="testVoiceBtn">🔊 Probar voz</button>
  <button id="overlayBtn">🖥️ Generar overlay</button>
</div>
<div class="overlay-url overlay-hide" id="overlayUrl"></div>
<div class="overlay-banner" id="overlayBanner">OVERLAY TIKTOK LIVE</div>

<div class="options">
  <button id="skipBtn">⏭️ Saltar mensaje actual</button>

  <div class="row">
    <label for="voiceSelect">Voz</label>
    <select id="voiceSelect"></select>
  </div>
  <div class="row">
    <label for="rate">Velocidad de lectura</label>
    <input type="range" id="rate" min="0.7" max="1.8" step="0.1" value="1.15">
    <span id="rateVal">1.15</span>
  </div>
  <div class="row">
    <label for="pitch">Tono de voz</label>
    <input type="range" id="pitch" min="0.5" max="2" step="0.1" value="1">
    <span id="pitchVal">1.0</span>
  </div>
  <div class="row">
    <label for="volume">Volumen</label>
    <input type="range" id="volume" min="0" max="1" step="0.05" value="1">
    <span id="volumeVal">100%</span>
  </div>
  <div class="check-grid">
    <label><input type="checkbox" id="showMembers" checked> 👋 Mostrar miembros</label>
    <label><input type="checkbox" id="readMembers"> 🔊 Leer miembros</label>
    <label><input type="checkbox" id="showLikes" checked> ❤️ Mostrar likes</label>
    <label><input type="checkbox" id="readLikes"> 🔊 Leer likes</label>
    <label><input type="checkbox" id="showGifts" checked> 🎁 Mostrar regalos</label>
    <label><input type="checkbox" id="readGifts"> 🔊 Leer regalos</label>
  </div>
  <div class="row">
    <label for="maxLikeBurst">Máx. likes leídos por evento</label>
    <input type="range" id="maxLikeBurst" min="1" max="20" step="1" value="5">
    <span id="maxLikeBurstVal">5</span>
  </div>
  <div class="row">
    <label for="minLen">Ignorar mensajes de menos de X caracteres</label>
    <input type="range" id="minLen" min="0" max="10" step="1" value="1">
    <span id="minLenVal">1</span>
  </div>
  <div class="row">
    <label style="flex:none;">
      <input type="checkbox" id="readUser" checked> Decir el nombre de usuario antes del mensaje
    </label>
  </div>
  <div class="row">
    <label style="flex:none;">
      <input type="checkbox" id="soundOnGift" checked> 🔔 Sonido al recibir un regalo
    </label>
  </div>

  <div class="row" style="flex-direction:column;align-items:stretch;gap:6px;">
    <label style="flex:none;">Modo de lectura</label>
    <div class="mode-switch">
      <button id="modeQueueBtn" class="active">📋 Cola</button>
      <button id="modeCooldownBtn">⏱️ Enfriamiento</button>
    </div>
  </div>

  <div class="mode-panel active" id="queuePanel">
    <div class="row">
      <label for="maxQueue">Máximo de mensajes en espera</label>
      <input type="range" id="maxQueue" min="2" max="15" step="1" value="6">
      <span id="maxQueueVal">6</span>
    </div>
  </div>

  <div class="mode-panel" id="cooldownPanel">
    <div class="row">
      <label for="cooldown">Enfriamiento entre mensajes (segundos)</label>
      <input type="range" id="cooldown" min="0" max="8" step="0.5" value="1.5">
      <span id="cooldownVal">1.5s</span>
    </div>
    <div class="row" style="font-size:.78rem;">
      <label style="flex:none;">Solo lee el mensaje más reciente; nunca se atrasa.</label>
    </div>
  </div>
</div>

<div id="chatBox"></div>

<footer id="modeFooter">Modo Cola: los mensajes se leen en orden; si se acumulan demasiados, se saltan los más viejos.</footer>

<script src="/socket.io/socket.io.js"></script>
<script>
const socket = io();
const $ = id => document.getElementById(id);

const statusEl = $("status");
const chatBox = $("chatBox");
const usernameInput = $("username");
const connectBtn = $("connectBtn");
const disconnectBtn = $("disconnectBtn");
const skipBtn = $("skipBtn");
const voiceSelect = $("voiceSelect");
const rateInput = $("rate");
const rateVal = $("rateVal");
const pitchInput = $("pitch");
const pitchVal = $("pitchVal");
const volumeInput = $("volume");
const volumeVal = $("volumeVal");
const showMembers = $("showMembers");
const readMembers = $("readMembers");
const showLikes = $("showLikes");
const readLikes = $("readLikes");
const showGifts = $("showGifts");
const readGifts = $("readGifts");
const maxLikeBurstInput = $("maxLikeBurst");
const maxLikeBurstVal = $("maxLikeBurstVal");
const testVoiceBtn = $("testVoiceBtn");
const overlayBtn = $("overlayBtn");
const overlayUrl = $("overlayUrl");
const overlayBanner = $("overlayBanner");
const maxQueueInput = $("maxQueue");
const maxQueueVal = $("maxQueueVal");
const cooldownInput = $("cooldown");
const cooldownVal = $("cooldownVal");
const minLenInput = $("minLen");
const minLenVal = $("minLenVal");
const readUserCheckbox = $("readUser");
const soundOnGiftCheckbox = $("soundOnGift");
const modeQueueBtn = $("modeQueueBtn");
const modeCooldownBtn = $("modeCooldownBtn");
const queuePanel = $("queuePanel");
const cooldownPanel = $("cooldownPanel");
const modeFooter = $("modeFooter");
const speakingIndicator = $("speakingIndicator");
const statRead = $("statRead");
const statSkipped = $("statSkipped");

let mode = "queue"; // "queue" | "cooldown"
let readCount = 0;
let skippedCount = 0;

const PREFS_KEY = "tiktok-live-tts-prefs";
function savePrefs(){
  try {
    localStorage.setItem(PREFS_KEY, JSON.stringify({
      voice: voiceSelect.value,
      rate: rateInput.value,
      pitch: pitchInput.value,
      volume: volumeInput.value,
      showMembers: showMembers.checked,
      readMembers: readMembers.checked,
      showLikes: showLikes.checked,
      readLikes: readLikes.checked,
      showGifts: showGifts.checked,
      readGifts: readGifts.checked,
      maxLikeBurst: maxLikeBurstInput.value,
      maxQueue: maxQueueInput.value,
      cooldown: cooldownInput.value,
      minLen: minLenInput.value,
      readUser: readUserCheckbox.checked,
      soundOnGift: soundOnGiftCheckbox.checked,
      mode
    }));
  } catch(e) {}
}
function loadPrefs(){
  try {
    const raw = localStorage.getItem(PREFS_KEY);
    if (!raw) return;
    const p = JSON.parse(raw);
    if (p.rate) rateInput.value = p.rate;
    if (p.pitch) pitchInput.value = p.pitch;
    if (p.volume) volumeInput.value = p.volume;
    if (p.maxLikeBurst) maxLikeBurstInput.value = p.maxLikeBurst;
    if (typeof p.showMembers === "boolean") showMembers.checked = p.showMembers;
    if (typeof p.readMembers === "boolean") readMembers.checked = p.readMembers;
    if (typeof p.showLikes === "boolean") showLikes.checked = p.showLikes;
    if (typeof p.readLikes === "boolean") readLikes.checked = p.readLikes;
    if (typeof p.showGifts === "boolean") showGifts.checked = p.showGifts;
    if (typeof p.readGifts === "boolean") readGifts.checked = p.readGifts;
    if (p.maxLikeBurst) maxLikeBurstInput.value = p.maxLikeBurst;
    if (p.maxQueue) maxQueueInput.value = p.maxQueue;
    if (p.cooldown) cooldownInput.value = p.cooldown;
    if (p.minLen) minLenInput.value = p.minLen;
    if (typeof p.readUser === "boolean") readUserCheckbox.checked = p.readUser;
    if (typeof p.soundOnGift === "boolean") soundOnGiftCheckbox.checked = p.soundOnGift;
    if (p.mode) setMode(p.mode, true);
    if (p.voice) voiceSelect.dataset.preferred = p.voice;
    updateLabels();
  } catch(e) {}
}

function updateLabels(){
  rateVal.textContent = Number(rateInput.value).toFixed(2);
  maxQueueVal.textContent = maxQueueInput.value;
  cooldownVal.textContent = Number(cooldownInput.value).toFixed(1) + "s";
  minLenVal.textContent = minLenInput.value;
  pitchVal.textContent = Number(pitchInput.value).toFixed(1);
  volumeVal.textContent = Math.round(Number(volumeInput.value) * 100) + "%";
  maxLikeBurstVal.textContent = maxLikeBurstInput.value;
}
[rateInput, pitchInput, volumeInput, maxQueueInput, cooldownInput, minLenInput, maxLikeBurstInput].forEach(el =>
  el.addEventListener("input", () => { updateLabels(); savePrefs(); })
);
[readUserCheckbox, soundOnGiftCheckbox, showMembers, readMembers, showLikes, readLikes, showGifts, readGifts].forEach(el =>
  el.addEventListener("change", savePrefs)
);
updateLabels();

function setMode(newMode, skipSave){
  mode = newMode;
  const isQueue = mode === "queue";
  modeQueueBtn.classList.toggle("active", isQueue);
  modeCooldownBtn.classList.toggle("active", !isQueue);
  modeCooldownBtn.classList.toggle("cooldown-active", !isQueue);
  queuePanel.classList.toggle("active", isQueue);
  cooldownPanel.classList.toggle("active", !isQueue);
  modeFooter.textContent = isQueue
    ? "Modo Cola: los mensajes se leen en orden; si se acumulan demasiados, se saltan los más viejos."
    : "Modo Enfriamiento: nunca hace fila. Si llegan mensajes durante el enfriamiento, solo se lee el más reciente.";
  speechQueue = [];
  pendingCooldownMsg = null;
  if (!skipSave) savePrefs();
}
modeQueueBtn.addEventListener("click", () => setMode("queue"));
modeCooldownBtn.addEventListener("click", () => setMode("cooldown"));

function loadVoices(){
  const voices = speechSynthesis.getVoices();
  voiceSelect.innerHTML = "";
  const spanishVoices = voices.filter(v => v.lang.toLowerCase().startsWith("es"));
  const list = spanishVoices.length ? spanishVoices : voices;
  list.forEach(v => {
    const opt = document.createElement("option");
    opt.value = v.name;
    opt.textContent = `${v.name} (${v.lang})`;
    voiceSelect.appendChild(opt);
  });
  const preferred = voiceSelect.dataset.preferred;
  if (preferred && list.some(v => v.name === preferred)) {
    voiceSelect.value = preferred;
  }
}
loadVoices();
if (speechSynthesis.onvoiceschanged !== undefined) {
  speechSynthesis.onvoiceschanged = loadVoices;
}
voiceSelect.addEventListener("change", savePrefs);

let audioCtx = null;
function playChime(){
  if (!soundOnGiftCheckbox.checked) return;
  try {
    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    const now = audioCtx.currentTime;
    [880, 1320].forEach((freq, i) => {
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = "sine";
      osc.frequency.value = freq;
      gain.gain.setValueAtTime(0.001, now + i * 0.1);
      gain.gain.exponentialRampToValueAtTime(0.15, now + i * 0.1 + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.001, now + i * 0.1 + 0.35);
      osc.connect(gain).connect(audioCtx.destination);
      osc.start(now + i * 0.1);
      osc.stop(now + i * 0.1 + 0.4);
    });
  } catch(e) {}
}

let speechQueue = [];
let speaking = false;
let currentEl = null;

function enqueueSpeech(text, el){
  const maxQueue = parseInt(maxQueueInput.value, 10);
  while (speechQueue.length >= maxQueue) {
    const dropped = speechQueue.shift();
    markSkipped(dropped?.el);
  }
  speechQueue.push({ text, el });
  processQueue();
}

function processQueue(){
  if (speaking || speechQueue.length === 0) return;
  const item = speechQueue.shift();
  speak(item.text, item.el, () => processQueue());
}

let pendingCooldownMsg = null;
let cooldownTimer = null;

function offerCooldownSpeech(text, el){
  if (speaking) {
    if (pendingCooldownMsg) markSkipped(pendingCooldownMsg.el);
    pendingCooldownMsg = { text, el };
    return;
  }
  if (cooldownTimer) {
    if (pendingCooldownMsg) markSkipped(pendingCooldownMsg.el);
    pendingCooldownMsg = { text, el };
    return;
  }
  speak(text, el, startCooldown);
}

function startCooldown(){
  const seconds = parseFloat(cooldownInput.value);
  if (seconds <= 0) {
    if (pendingCooldownMsg) {
      const next = pendingCooldownMsg;
      pendingCooldownMsg = null;
      speak(next.text, next.el, startCooldown);
    }
    return;
  }
  cooldownTimer = setTimeout(() => {
    cooldownTimer = null;
    if (pendingCooldownMsg) {
      const next = pendingCooldownMsg;
      pendingCooldownMsg = null;
      speak(next.text, next.el, startCooldown);
    }
  }, seconds * 1000);
}

function speak(text, el, onDone){
  speaking = true;
  currentEl = el;
  if (el) el.classList.add("reading");
  speakingIndicator.classList.add("active");

  const utter = new SpeechSynthesisUtterance(text);
  const voices = speechSynthesis.getVoices();
  const chosen = voices.find(v => v.name === voiceSelect.value);
  if (chosen) utter.voice = chosen;
  utter.rate = parseFloat(rateInput.value);
  utter.pitch = parseFloat(pitchInput.value);
  utter.volume = parseFloat(volumeInput.value);
  utter.lang = chosen ? chosen.lang : "es-ES";

  const finish = () => {
    speaking = false;
    if (el) el.classList.remove("reading");
    speakingIndicator.classList.remove("active");
    currentEl = null;
    readCount++;
    statRead.textContent = readCount;
    if (onDone) onDone();
  };

  utter.onend = finish;
  utter.onerror = finish;
  speechSynthesis.speak(utter);
}

function markSkipped(el){
  skippedCount++;
  statSkipped.textContent = skippedCount;
  if (el) {
    el.classList.add("skipped");
    el.querySelector(".text")?.insertAdjacentHTML("beforeend", ' <span class="badge">omitido</span>');
  }
}

skipBtn.addEventListener("click", () => {
  if (speaking) {
    speechSynthesis.cancel();
  }
});

function addMessage({ user, text, type }){
  const div = document.createElement("div");
  div.className = "msg" + (type ? " " + type : "");
  if (type === "system") {
    div.textContent = text;
  } else {
    div.innerHTML = `<span class="user">${escapeHtml(user)}</span><span class="text">${escapeHtml(text)}</span>`;
  }
  chatBox.appendChild(div);
  chatBox.scrollTop = chatBox.scrollHeight;
  while (chatBox.children.length > 150) {
    chatBox.removeChild(chatBox.firstChild);
  }
  return div;
}

function escapeHtml(str){
  const d = document.createElement("div");
  d.textContent = str;
  return d.innerHTML;
}


function buildSpeechForEvent(type, user, value) {
  if (type === 'chat') return readUserCheckbox.checked ? `${user} dice: ${value}` : value;
  if (type === 'member') return `${user} se unió al live`;
  if (type === 'like') return `${user} dio ${Math.max(1, Number(value) || 1)} likes`;
  if (type === 'gift') return `${user} envió ${value}`;
  return value;
}

function testVoice(){
  speechSynthesis.cancel();
  const chosen = speechSynthesis.getVoices().find(v => v.name === voiceSelect.value);
  const utter = new SpeechSynthesisUtterance('Prueba de voz. Esta es la configuración actual.');
  if (chosen) utter.voice = chosen;
  utter.lang = chosen ? chosen.lang : 'es-ES';
  utter.rate = parseFloat(rateInput.value);
  utter.pitch = parseFloat(pitchInput.value);
  utter.volume = parseFloat(volumeInput.value);
  speakingIndicator.classList.add('active');
  utter.onend = utter.onerror = () => speakingIndicator.classList.remove('active');
  speechSynthesis.speak(utter);
}
testVoiceBtn.addEventListener('click', testVoice);

function enableOverlayMode(){
  document.body.classList.add('overlay-mode');
  overlayBanner.style.display='block';
  socket.emit('get-live-state');
}
function makeOverlayLink(){
  const u = usernameInput.value.trim().replace(/^@/,'');
  if (!u) { alert('Escribe primero el usuario de TikTok.'); return; }
  const url = new URL(window.location.href);
  url.searchParams.set('overlay','1');
  url.searchParams.set('user',u);
  overlayUrl.textContent = url.toString();
  overlayUrl.style.display='block';
  try { navigator.clipboard?.writeText(url.toString()); } catch(e) {}
}
overlayBtn.addEventListener('click', makeOverlayLink);

const params = new URLSearchParams(location.search);
if (params.get('overlay') === '1') {
  enableOverlayMode();
  const overlayUser = (params.get('user') || '').replace(/^@/,'').trim();
  if (overlayUser) {
    usernameInput.value = overlayUser;
    socket.on('connect', () => socket.emit('connect-to-live', overlayUser));
  }
}

socket.on("connected", ({ username }) => {
  statusEl.textContent = `🔴 EN VIVO — conectado a @${username}`;
  statusEl.className = "status live";
  connectBtn.disabled = true;
  disconnectBtn.disabled = false;
  addMessage({ text: `Conectado al live de @${username}`, type: "system" });
});

socket.on("connection-error", (msg) => {
  statusEl.textContent = "❌ " + msg;
  statusEl.className = "status error";
  connectBtn.disabled = false;
  disconnectBtn.disabled = true;
});

socket.on("stream-ended", () => {
  statusEl.textContent = "El live terminó o se desconectó.";
  statusEl.className = "status error";
  connectBtn.disabled = false;
  disconnectBtn.disabled = true;
});

socket.on("chat-message", ({ user, comment }) => {
  const minLen = parseInt(minLenInput.value, 10);
  const el = addMessage({ user, text: comment });

  if (comment && comment.trim().length >= minLen) {
    const textToRead = readUserCheckbox.checked ? `${user} dice: ${comment}` : comment;
    if (mode === "queue") {
      enqueueSpeech(textToRead, el);
    } else {
      offerCooldownSpeech(textToRead, el);
    }
  }
});

socket.on("gift-message", ({ user, giftName, repeatCount }) => {
  if (showGifts.checked) {
    const text = `envió ${repeatCount}x ${giftName} 🎁`;
    const el = addMessage({ user, text, type: "gift event-gift" });
    playChime();
    if (readGifts.checked) {
      const speech = buildSpeechForEvent('gift', user, `${repeatCount} ${giftName}`);
      mode === 'queue' ? enqueueSpeech(speech, el) : offerCooldownSpeech(speech, el);
    }
  }
});

socket.on("like-message", ({ user, likeCount }) => {
  if (!showLikes.checked) return;
  const amount = Math.min(Math.max(1, Number(likeCount)||1), Number(maxLikeBurstInput.value));
  const text = `dio ${amount} like${amount === 1 ? '' : 's'} ❤️`;
  const el = addMessage({ user, text, type: "event-like" });
  if (readLikes.checked) {
    const speech = buildSpeechForEvent('like', user, amount);
    mode === 'queue' ? enqueueSpeech(speech, el) : offerCooldownSpeech(speech, el);
  }
});

socket.on("member-message", ({ user }) => {
  if (!showMembers.checked) return;
  const el = addMessage({ user, text: "se unió al live 👋", type: "event-member" });
  if (readMembers.checked) {
    const speech = buildSpeechForEvent('member', user);
    mode === 'queue' ? enqueueSpeech(speech, el) : offerCooldownSpeech(speech, el);
  }
});

connectBtn.addEventListener("click", () => {
  const username = usernameInput.value.trim();
  if (!username) return;
  try {
    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
  } catch(e) {}

  chatBox.innerHTML = "";
  speechQueue = [];
  pendingCooldownMsg = null;
  clearTimeout(cooldownTimer);
  cooldownTimer = null;
  readCount = 0;
  skippedCount = 0;
  statRead.textContent = "0";
  statSkipped.textContent = "0";

  statusEl.textContent = "Conectando...";
  statusEl.className = "status";
  socket.emit("connect-to-live", username);
});

disconnectBtn.addEventListener("click", () => {
  socket.emit("disconnect-live");
  speechSynthesis.cancel();
  speechQueue = [];
  pendingCooldownMsg = null;
  clearTimeout(cooldownTimer);
  cooldownTimer = null;
  speaking = false;
  speakingIndicator.classList.remove("active");
  statusEl.textContent = "Desconectado.";
  statusEl.className = "status";
  connectBtn.disabled = false;
  disconnectBtn.disabled = true;
});

loadPrefs();
</script>
</body>
</html>
